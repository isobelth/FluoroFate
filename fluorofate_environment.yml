name: fluorofate

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip
  - ipykernel
  - numpy<3
  - pandas<3
  - matplotlib<4
  - seaborn
  - scikit-image<1
  - tifffile
  - napari<1
  - pyside6
  - magicgui
  - qtpy
  - openjdk=21
  - maven
  - pyimagej<2
  - scyjava<2
  - nomkl
  - "libblas=*=*openblas"
  - pip:
      - cellpose>=4.1,<5
